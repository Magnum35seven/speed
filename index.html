<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD Speed</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="app-header">
        <div id="clock">00:00</div>
        <!-- Speed Unit Toggle Button -->
        <button id="unit-toggle" class="unit-toggle-btn" aria-label="Toggle speed unit">km/h</button>
    </header>

    <main class="hud-container">
        <div class="speed-display">
            <span id="speed-value">0</span>
            <span id="unit-label" class="unit-label">km/h</span>
        </div>
        <div class="speed-bar-container">
            <div id="speed-bar" class="speed-bar"></div>
        </div>
        <div id="road-name" class="road-name">Locating...</div>
    </main>

    <footer class="telemetry-footer">
        <div class="stat-item">
            <span class="stat-label">MAX</span>
            <span id="max-speed">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">DIST</span>
            <span id="distance">0.0</span>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
