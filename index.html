<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD Speedometer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div id="clock">00:00</div>
        <div class="header-controls">
            <button id="reset-btn" class="btn btn-reset">
                <span class="icon">🔄</span>
                <span>Reset</span>
            </button>
            <button id="hud-toggle" class="btn btn-hud">
                <span class="icon">🪞</span>
                <span>HUD</span>
            </button>
            <button id="unit-toggle" class="btn btn-unit">KM/H</button>
        </div>
    </header>

    <div class="mode-selector">
        <button class="mode-btn active" data-mode="analog">Analog</button>
        <button class="mode-btn" data-mode="minimalist">Minimalist</button>
        <button class="mode-btn" data-mode="sport">Sport</button>
        <button id="gforce-toggle" class="mode-btn gforce-btn">Enable G-Force</button>
    </div>

    <main class="hud-container">
        <!-- Gauge View -->
        <div id="analog-view" class="card gauge-card">
            <div class="gauge-wrapper">
                <svg class="gauge-svg" viewBox="0 0 200 200">
                    <!-- Gauge Arc Ring -->
                    <path d="M 30 150 A 70 70 0 1 1 170 150" fill="none" stroke="#252629" stroke-width="8" stroke-linecap="round"/>
                    
                    <!-- Tick Marks & Numbers -->
                    <text x="30" y="150" class="tick">0</text>
                    <text x="35" y="105" class="tick">20</text>
                    <text x="55" y="65" class="tick">40</text>
                    <text x="88" y="45" class="tick">60</text>
                    <text x="100" y="32" class="tick">80</text>
                    <text x="125" y="45" class="tick">100</text>
                    <text x="150" y="65" class="tick">120</text>
                    <text x="168" y="105" class="tick">140</text>
                    <text x="165" y="150" class="tick">160</text>

                    <!-- Needle -->
                    <line id="needle" x1="100" y1="100" x2="45" y2="145" stroke="#007aff" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="100" cy="100" r="6" fill="#007aff"/>
                </svg>

                <div class="speed-readout">
                    <span id="speed-value">0</span>
                    <span id="unit-label" class="unit-label">KM/H</span>
                </div>
            </div>
        </div>

        <!-- Location Box -->
        <div class="card location-card">
            <span class="location-title">CURRENT LOCATION</span>
            <div id="road-name" class="road-name">Locating...</div>
            <div id="suburb-name" class="suburb-name"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
