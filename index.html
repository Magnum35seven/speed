<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="background-color" content="#000000">
    <title>HUD Speedometer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <button id="reset-btn" class="btn btn-reset">
                <span class="icon">🔄</span>
                <span>Reset</span>
            </button>
        </div>

        <div id="clock">00:00</div>

        <div class="header-right">
            <button id="hud-toggle" class="btn btn-hud">
                <span class="icon">🪞</span>
                <span>HUD</span>
            </button>
            <button id="unit-toggle" class="btn btn-unit">KM/H</button>
        </div>
    </header>

    <div class="mode-selector">
        <button class="mode-btn active" data-mode="analog">Analog</button>
        <button class="mode-btn" data-mode="minimalist">Minimalist</button>
        <button class="mode-btn" data-mode="sport">Sport</button>
    </div>

    <main class="hud-container">
        <!-- Analog View -->
        <div id="analog-view" class="card gauge-card mode-view active">
            <div class="gauge-wrapper">
                <svg class="gauge-svg" viewBox="0 0 200 200">
                    <path class="gauge-track" d="M 30 150 A 70 70 0 1 1 170 150" fill="none" stroke="#252629" stroke-width="8" stroke-linecap="round"/>
                    
                    <text x="32" y="152" class="tick">0</text>
                    <text x="35" y="100" class="tick">20</text>
                    <text x="58" y="58" class="tick">40</text>
                    <text x="92" y="38" class="tick">60</text>
                    <text x="100" y="30" class="tick">80</text>
                    <text x="110" y="38" class="tick">100</text>
                    <text x="142" y="58" class="tick">120</text>
                    <text x="165" y="100" class="tick">140</text>
                    <text x="168" y="152" class="tick">160</text>

                    <line id="needle" x1="100" y1="100" x2="50" y2="150" stroke="#007aff" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="100" cy="100" r="6" fill="#007aff"/>
                </svg>

                <div class="speed-readout">
                    <span class="speed-val">0</span>
                    <span class="unit-lbl">KM/H</span>
                </div>
            </div>
        </div>

        <!-- Minimalist View -->
        <div id="minimalist-view" class="card minimalist-card mode-view">
            <div class="minimalist-readout">
                <span class="speed-val mega-speed">0</span>
                <span class="unit-lbl">KM/H</span>
            </div>
        </div>

        <!-- Sport View -->
        <div id="sport-view" class="card sport-card mode-view">
            <div class="sport-readout">
                <span class="speed-val">0</span>
                <span class="unit-lbl">KM/H</span>
            </div>
            <div class="sport-bar-container">
                <div id="sport-bar" class="sport-bar"></div>
            </div>
        </div>

        <!-- Location Box -->
        <div class="card location-card">
            <span class="location-title">CURRENT LOCATION</span>
            <div id="road-name" class="road-name">Locating...</div>
            <div id="suburb-name" class="suburb-name"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
